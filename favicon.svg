<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E223D"/>
      <stop offset="100%" stop-color="#051021"/>
    </linearGradient>

    <!-- Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="35%" stop-color="#FFF2B2"/>
      <stop offset="70%" stop-color="#C5A862"/>
      <stop offset="100%" stop-color="#997A2E"/>
    </linearGradient>

    <!-- Subtle Gold Shadow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" />

  <!-- Outer Ring Accent Arc -->
  <path d="M 120,256 A 150,150 0 1,1 390,320" fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
  <path d="M 370,340 Q 420,310 440,250" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" opacity="0.9"/>

  <!-- Main TL Typography + Medical Staff -->
  <g filter="url(#goldGlow)">
    <!-- Letter T (Left) -->
    <path d="M 130 180 L 250 180 L 250 205 L 205 205 L 205 340 L 175 340 L 175 205 L 130 205 Z" fill="url(#goldGrad)"/>
    <path d="M 125 175 L 255 175 L 255 185 L 125 185 Z" fill="#FFF2B2" opacity="0.6"/>

    <!-- Letter L (Right) -->
    <path d="M 285 180 L 315 180 L 315 315 L 385 315 L 385 340 L 285 340 Z" fill="url(#goldGrad)"/>

    <!-- Central Caduceus / Rod of Asclepius Staff -->
    <!-- Central Rod -->
    <line x1="256" y1="140" x2="256" y2="370" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round"/>
    <!-- Top Spherical Gem -->
    <circle cx="256" cy="138" r="14" fill="url(#goldGrad)"/>
    <circle cx="254" cy="135" r="4" fill="#FFFFFF" opacity="0.8"/>

    <!-- Serpent Coiling Asclepius -->
    <path d="M 235,190 C 230,165 280,170 275,200 C 270,230 225,230 235,265 C 245,300 280,295 270,335 C 265,355 245,365 256,370" 
          fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>